<!DOCTYPE html>
<html lang="es"><!--es el idioma-->
<head><!--metadatos de la pagina-->
    <meta charset="UTF-8"> <!--es la region de colombia-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!--esto es las medidadas opara que se ajusten la pagina-->
    <title>iniciar sesión inventario adso</title>
    <!-- CSS de bootstrap 5.3.3 desde url predeterminada-->

     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"  rel="stylesheet">
     <link href="css/estilos.css" rel="stylesheet">

     <!--Libreria de iconos de Bootstrap-->

     <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
     <link href="css/estilos.css" rel="stylesheet"> <!--llama los estilos personalizados-->

</head>

<body class="bg-body-tertiary">
    <!--menu lateral-->
    <!--offcanvas en pantallas menores al lg es un panel oculto que se desliza -->
    <!--desde el lg se muestra normal. offcanvas-start
    lo hace salir por la izquierda . sidebar es muestra la clase el id usa el boton que lo abre-->
    
    
    <aside class="offcanvas-lg offcanvas-start sidebar"
    tabindex="-1" id="menuLateral" arial-labelledby="tituloMenu">
    <!--Encabezado del panel; bootstrap solo lo muestra en celular-->
    <div class="offcanvas-header border-bottom border-secondary">
        <!--Nombre del sistema en el panel movil-->
        <h5 class="offcanvas-title" id="tituloMenu">
            <i class="bi bi-shop me-2">Tienda Sena</i>
        </h5>
        <!--Boton X blanco de cierre del panel-->
        <button type="button" 
        class="btn-close btn-close-white" 
        data-bs-dismiss="offcanvas" 
        data-bs-target="#menuLateral" 
        arial-label="Cerrar menu">
    </button>
    <!--Cierra en encabezado movil-->

    </div>
    <!--Cuerpo del menu Flexbox en columna para apilar logo enlaces y boton de salida-->
    <div class="offcanvas-body d-flex-column p-3">
        <!--logo solo se ve en computador-->
        <a href="dashboard.html" class="d-none d-lg-flex align-items-center mb-3 text-white text-decoration-none fs-5 fw-bold">
            <!--Icono verde y nombre-->
            <i class="bi bi-shop me-2 text-sena"></i>Tienda Sena
            <!--Cierra logo-->
        </a>
    </div>



    </aside>

</body>
